apiVersion: apps/v1
kind: Deployment
metadata:
  name: third-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: third-app
  template:
    metadata:
      labels:
        app: third-app
    spec:
      containers:
        - name: hello
          image: nginxdemos/hello:plain-text
          ports:
            - containerPort: 80
